name: Deploy GestureMusic to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'gesturemusic-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gesturemusic-web/pnpm-lock.yaml
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: gesturemusic-web
        run: pnpm install --frozen-lockfile
      - name: Build site
        working-directory: gesturemusic-web
        run: pnpm build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gesturemusic-web/dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
